<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Customer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #050d1a;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background-color: #0a1628;
            border: 1px solid rgba(79, 156, 249, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
        }

        /* Top blue line accent */
        .card-top-line {
            height: 3px;
            background-color: #4f9cf9;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .card h2 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .card h2 span {
            color: #4f9cf9;
        }

        .card p {
            font-size: 13px;
            color: #7a92b4;
            margin-bottom: 30px;
        }

        /* Form fields */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #7a92b4;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: #0f2240;
            border: 1px solid rgba(79, 156, 249, 0.25);
            border-radius: 10px;
            color: #e8edf5;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input::placeholder {
            color: #3a5070;
        }

        .form-group input:focus {
            border-color: #4f9cf9;
            box-shadow: 0 0 0 3px rgba(79, 156, 249, 0.15);
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #4f9cf9;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s, transform 0.2s;
        }

        .submit-btn:hover {
            background-color: #2e7de0;
            transform: translateY(-1px);
        }

        /* Divider */
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #3a5070;
            font-size: 13px;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background-color: rgba(79, 156, 249, 0.15);
        }

        .divider::before { left: 0; }
        .divider::after  { right: 0; }

        /* Back link */
        .back-link {
            display: block;
            text-align: center;
            color: #7a92b4;
            text-decoration: none;
            font-size: 14px;
            padding: 12px;
            border: 1px solid rgba(79, 156, 249, 0.2);
            border-radius: 10px;
            transition: color 0.2s, border-color 0.2s;
        }

        .back-link:hover {
            color: #4f9cf9;
            border-color: #4f9cf9;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-top-line"></div>

        <h2>Add <span>Customer</span></h2>
        <p>Fill in the details below to add a new customer.</p>

        <form th:action="@{/saveCustomer}" th:object="${customer}" method="post">

            <div class="form-group">
                <label>Name</label>
                <input type="text" th:field="*{name}" placeholder="Enter full name" required />
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" placeholder="Enter email address" required />
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" th:field="*{phone}" placeholder="Enter phone number" required />
            </div>

            <div class="form-group">
                <label>Address</label>
                <input type="text" th:field="*{address}" placeholder="Enter address" required />
            </div>

            <button type="submit" class="submit-btn">Save Customer</button>

        </form>

        <div class="divider">or</div>

        <a href="/customer" class="back-link">View All Customers</a>
    </div>

</body>
</html>
